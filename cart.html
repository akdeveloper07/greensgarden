<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Botanical Cart | Green Garden</title>
  <link rel="icon" type="image/png" href="icon-512.png">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/botanical-theme.css">

  <style>
    .cart-page-wrap {
      max-width: 1360px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      flex-grow: 1;
    }

    .cart-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 40px;
      align-items: start;
    }

    .cart-items-panel {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      padding: 28px;
    }

    .cart-header-title {
      font-size: 1.8rem;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Free shipping meter */
    .shipping-meter {
      background: var(--ivory-100);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border-subtle);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sage-400), var(--sage-500));
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    /* Cart item card */
    .cart-item-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .cart-item-row:last-child {
      border-bottom: none;
    }

    .cart-item-img {
      width: 90px;
      height: 90px;
      border-radius: var(--radius-md);
      object-fit: cover;
      background: var(--ivory-100);
    }

    .cart-item-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--forest-900);
      margin-bottom: 4px;
    }

    .cart-item-category {
      font-size: 0.8rem;
      color: var(--sage-500);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cart-item-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--forest-900);
      margin-top: 6px;
    }

    .item-actions-col {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .qty-stepper-sm {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 2px 6px;
      background: #fff;
    }

    .qty-stepper-sm button {
      border: none;
      background: none;
      width: 26px;
      height: 26px;
      cursor: pointer;
      color: var(--forest-900);
      font-weight: 700;
    }

    .qty-stepper-sm span {
      width: 30px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .remove-link {
      background: none;
      border: none;
      color: #e63946;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Order summary panel */
    .summary-panel {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      padding: 28px;
      position: sticky;
      top: 100px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .summary-row.total-row {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--forest-900);
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      margin-top: 16px;
    }

    .coupon-box {
      margin: 20px 0;
      display: flex;
      gap: 8px;
    }

    .coupon-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      text-transform: uppercase;
      font-weight: 600;
      font-size: 0.9rem;
      outline: none;
    }

    .empty-cart-card {
      text-align: center;
      padding: 60px 20px;
    }

    @media (max-width: 900px) {
      .cart-grid {
        grid-template-columns: 1fr;
      }
      .summary-panel {
        position: static;
      }
    }
  </style>
</head>
<body>

  <div id="global-header"></div>

  <main class="cart-page-wrap">
    <div id="cartContentContainer">
      <!-- Injected by script -->
    </div>
  </main>

  <div id="global-footer"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script src="js/catalog.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>

  <script>
    let appliedCoupon = localStorage.getItem('gg_active_coupon') || null;

    document.addEventListener('DOMContentLoaded', () => {
      Store.renderHeader('cart');
      Store.renderFooter();
      renderCartView();

      window.addEventListener('cartUpdated', () => {
        renderCartView();
      });
    });

    function renderCartView() {
      const container = document.getElementById('cartContentContainer');
      const cart = Store.getCart();

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="cart-items-panel empty-cart-card">
            <div style="font-size: 4rem; margin-bottom: 16px;">🛒</div>
            <h2 style="font-size: 2rem; margin-bottom: 8px;">Your Garden Cart is Empty</h2>
            <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 480px; margin: 0 auto 28px;">
              Your botanical basket is waiting for living plants, heirloom flower seeds, and organic fertilizers.
            </p>
            <a href="products.html" class="btn-botanical btn-botanical-primary">
              <i class="fas fa-seedling"></i> Browse Our Catalog
            </a>
          </div>
        `;
        return;
      }

      const totals = Store.calculateTotals(appliedCoupon);
      const freeShipThreshold = 499;
      const progressPercent = Math.min(100, Math.round((totals.subtotal / freeShipThreshold) * 100));
      const amountNeeded = Math.max(0, freeShipThreshold - totals.subtotal);

      container.innerHTML = `
        <div class="cart-grid">
          <!-- Items Left Panel -->
          <div class="cart-items-panel">
            <div class="cart-header-title">
              <span>Shopping Cart (${totals.itemCount} items)</span>
              <button onclick="localStorage.removeItem('cart'); Store.updateBadgeCounters(); renderCartView();" style="border:none; background:none; color: #e63946; font-size: 0.85rem; cursor: pointer;">Clear Cart</button>
            </div>

            <!-- Free delivery meter -->
            <div class="shipping-meter">
              <div style="display: flex; justify-content: space-between; font-size: 0.88rem; font-weight: 700;">
                <span>${amountNeeded === 0 ? '🎉 You qualified for FREE Botanical Delivery!' : `Add ₹${amountNeeded} more for FREE Express Delivery`}</span>
                <span style="color: var(--sage-500);">${progressPercent}%</span>
              </div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
              </div>
            </div>

            <!-- Cart rows -->
            <div class="cart-items-list">
              ${cart.map(item => `
                <div class="cart-item-row">
                  <img src="${item.image}" alt="${item.name}" class="cart-item-img" onerror="this.src='garden.jpg'">
                  <div>
                    <span class="cart-item-category">${item.category || 'Gardening'}</span>
                    <h3 class="cart-item-name">${item.name}</h3>
                    ${item.variant ? `<div style="font-size: 0.8rem; color: var(--text-muted);">${item.variant}</div>` : ''}
                    <div class="cart-item-price">₹${item.price} each</div>
                  </div>
                  <div class="item-actions-col">
                    <div class="qty-stepper-sm">
                      <button onclick="Store.updateQuantity('${item.cartItemId || item.id}', ${(item.quantity || 1) - 1})">-</button>
                      <span>${item.quantity || 1}</span>
                      <button onclick="Store.updateQuantity('${item.cartItemId || item.id}', ${(item.quantity || 1) + 1})">+</button>
                    </div>
                    <div style="font-weight: 800; font-size: 1.1rem; color: var(--forest-900);">
                      ₹${item.price * (item.quantity || 1)}
                    </div>
                    <button class="remove-link" onclick="Store.removeFromCart('${item.cartItemId || item.id}')">
                      <i class="fas fa-trash-alt"></i> Remove
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;">
              <a href="products.html" style="font-size: 0.9rem; color: var(--forest-700); font-weight: 700;">
                <i class="fas fa-arrow-left"></i> Continue Shopping
              </a>
              <div style="font-size: 0.82rem; color: var(--text-muted);">
                <i class="fas fa-shield-alt text-success"></i> 7-Day Live Plant Transit Guarantee
              </div>
            </div>
          </div>

          <!-- Order Summary Right Panel -->
          <div class="summary-panel">
            <h3 style="font-size: 1.4rem; margin-bottom: 20px;">Order Summary</h3>

            <div class="summary-row">
              <span>Item Subtotal</span>
              <span>₹${totals.subtotal}</span>
            </div>

            ${totals.discount > 0 ? `
              <div class="summary-row" style="color: #2e7d32; font-weight: 600;">
                <span>Coupon / Points Discount</span>
                <span>-₹${totals.discount}</span>
              </div>
            ` : ''}

            <div class="summary-row">
              <span>Eco-Safe Climate Shipping</span>
              <span>${totals.shippingFee === 0 ? '<strong style="color: #2e7d32;">FREE</strong>' : `₹${totals.shippingFee}`}</span>
            </div>

            <div class="summary-row">
              <span>Agricultural GST (5%)</span>
              <span>₹${totals.gstTax}</span>
            </div>

            <!-- Coupon Code Field -->
            <div class="coupon-box">
              <input type="text" id="couponInput" class="coupon-input" placeholder="Promo code (e.g. GREEN15)" value="${appliedCoupon || ''}">
              <button class="btn-botanical btn-botanical-secondary" style="padding: 8px 16px;" onclick="applyPromoCode()">Apply</button>
            </div>
            ${appliedCoupon ? `
              <div style="font-size: 0.78rem; color: #2e7d32; margin-top: -12px; margin-bottom: 12px; display: flex; justify-content: space-between;">
                <span>✓ Code <strong>${appliedCoupon}</strong> active</span>
                <a href="#" onclick="removePromoCode(event)" style="color: #e63946; text-decoration: underline;">Remove</a>
              </div>
            ` : ''}

            <div class="summary-row total-row">
              <span>Total Payable</span>
              <span>₹${totals.finalTotal}</span>
            </div>

            <button class="btn-botanical btn-botanical-accent" style="width: 100%; padding: 14px; margin-top: 24px; font-size: 1.05rem;" onclick="window.location.href='buy.html'">
              <span>Proceed to Checkout</span>
              <i class="fas fa-arrow-right"></i>
            </button>

            <div style="margin-top: 16px; text-align: center; font-size: 0.78rem; color: var(--text-muted); display: flex; justify-content: center; gap: 14px;">
              <span><i class="fas fa-lock text-success"></i> 256-bit SSL</span>
              <span><i class="fas fa-undo"></i> Easy Replacement</span>
            </div>
          </div>
        </div>
      `;
    }

    function applyPromoCode() {
      const code = document.getElementById('couponInput').value.trim().toUpperCase();
      if (!code) return;
      if (COUPON_DATABASE[code]) {
        appliedCoupon = code;
        localStorage.setItem('gg_active_coupon', code);
        Store.showToast(`✨ Coupon ${code} applied successfully!`);
        renderCartView();
      } else {
        Store.showToast("Invalid or expired coupon code", true);
      }
    }

    function removePromoCode(e) {
      e.preventDefault();
      appliedCoupon = null;
      localStorage.removeItem('gg_active_coupon');
      Store.showToast("Coupon removed");
      renderCartView();
    }
  </script>
</body>
</html>
