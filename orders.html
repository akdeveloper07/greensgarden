<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Live Botanical Tracker | Green Garden</title>
  <link rel="icon" type="image/png" href="icon-512.png">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/botanical-theme.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    .orders-page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .order-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      margin-bottom: 30px;
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    .order-card-header {
      background: var(--ivory-100);
      padding: 20px 28px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .order-meta-item {
      display: flex;
      flex-direction: column;
    }

    .meta-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .meta-val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--forest-900);
    }

    /* Live Botanical Tracking Timeline (Phase 13) */
    .timeline-container {
      padding: 30px 28px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-subtle);
    }

    .timeline-track {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 20px 0 10px;
    }

    .timeline-track::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: #e2e8f0;
      z-index: 1;
    }

    .timeline-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
    }

    .step-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
      transition: var(--transition-fast);
    }

    .timeline-step.completed .step-circle {
      background: var(--forest-700);
      border-color: var(--forest-700);
      color: #ffffff;
    }

    .timeline-step.active .step-circle {
      background: var(--brass-500);
      border-color: var(--brass-500);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(197, 139, 73, 0.25);
    }

    .step-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .timeline-step.completed .step-label,
    .timeline-step.active .step-label {
      color: var(--forest-900);
    }

    .step-date {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Order Items Area */
    .order-items-area {
      padding: 24px 28px;
    }

    .ordered-item-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .ordered-item-row:last-child {
      border-bottom: none;
    }

    .ordered-item-row img {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-md);
      object-fit: cover;
    }

    .order-card-footer {
      background: var(--ivory-50);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .status-pill.Placed { background: #e0f2fe; color: #0369a1; }
    .status-pill.Confirmed { background: #dcfce7; color: #15803d; }
    .status-pill.Dispatched { background: #fef3c7; color: #b45309; }
    .status-pill.Delivered { background: #d1fae5; color: #047857; }
    .status-pill.Cancelled { background: #fee2e2; color: #b91c1c; }

    @media (max-width: 768px) {
      .timeline-track {
        flex-direction: column;
        gap: 16px;
      }
      .timeline-track::before {
        display: none;
      }
      .timeline-step {
        flex-direction: row;
        text-align: left;
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <div id="global-header"></div>

  <main class="orders-page-wrap">
    <div style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
      <div>
        <h1 style="font-size: 2.2rem; margin-bottom: 6px;">My Botanical Orders & Live Tracker</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Track live climate-controlled delivery status, download invoices, and care for your living specimens.</p>
      </div>
      <a href="products.html" class="btn-botanical btn-botanical-secondary">
        <i class="fas fa-plus"></i> Shop More Plants
      </a>
    </div>

    <div id="ordersListContainer">
      <div style="text-align: center; padding: 60px;">
        <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--sage-500);"></i>
      </div>
    </div>
  </main>

  <div id="global-footer"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script src="js/catalog.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Store.renderHeader('orders');
      Store.renderFooter();

      const user = AuthService.getCurrentUser();
      const orders = await OrderService.getUserOrders(user ? user.uid : null);
      renderOrders(orders);
    });

    function renderOrders(orders) {
      const container = document.getElementById('ordersListContainer');
      const params = new URLSearchParams(window.location.search);
      const newOrderId = params.get('newOrder');

      if (!orders || orders.length === 0) {
        container.innerHTML = `
          <div style="background: #fff; border-radius: 24px; padding: 60px 24px; text-align: center; border: 1px dashed var(--border-subtle);">
            <div style="font-size: 4rem; margin-bottom: 12px;">🌱</div>
            <h2 style="margin-bottom: 8px;">No Plant Orders Yet</h2>
            <p style="color: var(--text-muted); max-width: 440px; margin: 0 auto 24px;">Your garden haven is awaiting its first live plant delivery.</p>
            <a href="products.html" class="btn-botanical btn-botanical-primary">Explore Conservatory Catalog</a>
          </div>
        `;
        return;
      }

      // Steps definition
      const STEPS = ['Placed', 'Packing', 'Dispatched', 'Out for Delivery', 'Delivered'];

      container.innerHTML = orders.map(order => {
        const isHighlight = order.orderId === newOrderId;
        const currentStepIndex = STEPS.indexOf(order.status) !== -1 ? STEPS.indexOf(order.status) : (order.status === 'Cancelled' ? -1 : 0);

        return `
          <div class="order-card" style="${isHighlight ? 'border: 2px solid var(--sage-400); box-shadow: var(--shadow-lg);' : ''}">
            ${isHighlight ? `
              <div style="background: #ecfdf5; color: #065f46; padding: 10px 28px; font-size: 0.88rem; font-weight: 700; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-check-circle" style="color: #10b981;"></i> Order confirmed! A climate-controlled dispatch team has been notified.
              </div>
            ` : ''}

            <div class="order-card-header">
              <div class="order-meta-item">
                <span class="meta-label">Order Reference</span>
                <span class="meta-val">${order.orderId}</span>
              </div>
              <div class="order-meta-item">
                <span class="meta-label">Date Placed</span>
                <span class="meta-val">${new Date(order.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
              </div>
              <div class="order-meta-item">
                <span class="meta-label">Payment</span>
                <span class="meta-val">${order.paymentMethod === 'razorpay' ? 'Razorpay Verified' : 'Cash on Delivery'}</span>
              </div>
              <div class="order-meta-item">
                <span class="meta-label">Total Amount</span>
                <span class="meta-val" style="color: var(--forest-900);">₹${order.totalAmount}</span>
              </div>
              <div>
                <span class="status-pill ${order.status}">${order.status}</span>
              </div>
            </div>

            <!-- Live Timeline Tracker (Phase 13) -->
            ${order.status !== 'Cancelled' ? `
              <div class="timeline-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                  <span style="font-weight: 700; font-size: 0.9rem; color: var(--forest-900);">
                    <i class="fas fa-truck-moving" style="color: var(--sage-500);"></i> Live Botanical Transit Timeline
                  </span>
                  <span style="font-size: 0.8rem; color: var(--text-muted);">
                    Est. Arrival: <strong>${order.estimatedDelivery || 'In 3-4 days'}</strong>
                  </span>
                </div>

                <div class="timeline-track">
                  ${STEPS.map((step, idx) => {
                    const isCompleted = idx <= currentStepIndex;
                    const isActive = idx === currentStepIndex;
                    return `
                      <div class="timeline-step ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}">
                        <div class="step-circle">
                          <i class="fas ${isCompleted ? 'fa-check' : 'fa-circle'}"></i>
                        </div>
                        <div class="step-label">${step}</div>
                        <div class="step-date">${isCompleted ? 'Completed' : 'Pending'}</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : `
              <div style="padding: 20px 28px; background: #fee2e2; color: #991b1b; font-size: 0.9rem;">
                <i class="fas fa-ban"></i> This order was cancelled. Reason: ${order.cancellationReason || 'Customer requested cancellation.'}
              </div>
            `}

            <!-- Items List -->
            <div class="order-items-area">
              ${order.items.map(item => `
                <div class="ordered-item-row">
                  <img src="${item.image}" onerror="this.src='garden.jpg'">
                  <div style="flex: 1;">
                    <div style="font-weight: 700; font-size: 1rem; color: var(--forest-900);">${item.name}</div>
                    <div style="font-size: 0.82rem; color: var(--text-muted);">${item.variant ? item.variant + ' • ' : ''}Qty: ${item.quantity}</div>
                  </div>
                  <div style="font-weight: 800; font-size: 1.05rem;">
                    ₹${item.price * item.quantity}
                  </div>
                  <a href="plant-passport.html?addName=${encodeURIComponent(item.name)}&addImage=${encodeURIComponent(item.image)}" class="btn-botanical btn-botanical-secondary" style="font-size: 0.78rem; padding: 6px 14px;" title="Add to Digital Plant Passport">
                    <i class="fas fa-passport"></i> Passport
                  </a>
                </div>
              `).join('')}
            </div>

            <!-- Card Actions Footer -->
            <div class="order-card-footer">
              <div style="font-size: 0.85rem; color: var(--text-secondary);">
                Shipping to: <strong>${order.shippingAddress.name}</strong>, ${order.shippingAddress.city} - ${order.shippingAddress.pincode}
              </div>

              <div style="display: flex; gap: 10px;">
                <button onclick="downloadInvoice('${order.orderId}')" class="btn-botanical btn-botanical-secondary" style="font-size: 0.82rem; padding: 6px 14px;">
                  <i class="fas fa-file-invoice"></i> Download Invoice
                </button>
                
                ${order.status === 'Placed' ? `
                  <button onclick="cancelOrderPrompt('${order.orderId}')" style="background: none; border: 1px solid #e63946; color: #e63946; border-radius: var(--radius-full); padding: 6px 14px; font-size: 0.82rem; cursor: pointer;">
                    Cancel Order
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function downloadInvoice(orderId) {
      Store.showToast("Generating official botanical PDF invoice for #" + orderId + "...");
      window.print();
    }

    async function cancelOrderPrompt(orderId) {
      const reason = prompt("Please provide a reason for cancellation:", "Changed mind / duplicate order");
      if (!reason) return;

      const user = AuthService.getCurrentUser();
      if (window.OrderService) {
        await OrderService.updateOrderStatus(orderId, 'Cancelled', reason);
        Store.showToast("Order #" + orderId + " has been cancelled.");
        setTimeout(() => location.reload(), 600);
      }
    }
  </script>
</body>
</html>
