<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botanical Catalog & Seeds | Green Garden</title>
  <link rel="icon" type="image/png" href="icon-512.png">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/botanical-theme.css">

  <style>
    .catalog-header {
      background: linear-gradient(135deg, var(--forest-900), var(--forest-800));
      color: #fff;
      padding: 48px 24px 40px;
      text-align: center;
    }

    .catalog-header h1 {
      color: #fff;
      font-size: 2.8rem;
      margin-bottom: 8px;
    }

    .catalog-header p {
      color: var(--sage-200);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Filter & Search Bar */
    .filter-section {
      background: #ffffff;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 73px;
      z-index: 900;
      box-shadow: var(--shadow-sm);
    }

    .filter-container {
      max-width: 1360px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .filter-top-row {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      max-width: 460px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 11px 18px 11px 44px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: var(--ivory-50);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition-fast);
    }

    .search-box input:focus {
      background: #fff;
      border-color: var(--sage-400);
      box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.15);
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .custom-select {
      padding: 10px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: var(--ivory-50);
      color: var(--forest-900);
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .checkbox-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: var(--ivory-50);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      color: var(--forest-900);
      transition: var(--transition-fast);
    }

    .checkbox-pill.active {
      background: var(--sage-100);
      border-color: var(--sage-400);
      color: var(--forest-900);
    }

    /* Category Navigation Tabs */
    .category-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .cat-tab-btn {
      white-space: nowrap;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: var(--ivory-50);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .cat-tab-btn:hover {
      background: #ffffff;
      color: var(--forest-900);
      border-color: var(--sage-300);
    }

    .cat-tab-btn.active {
      background: var(--forest-800);
      color: #ffffff;
      border-color: var(--forest-800);
    }

    /* Main Grid Area */
    .catalog-main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 36px 24px 80px;
      flex-grow: 1;
    }

    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-subtle);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div id="global-header"></div>

  <div class="catalog-header">
    <h1>Conservatory & Seed Collection</h1>
    <p>Discover indigenous blooms, heirloom kitchen crops, living bonsai, and organic nursery care.</p>
  </div>

  <!-- Interactive Filter Toolbar -->
  <div class="filter-section">
    <div class="filter-container">
      <div class="filter-top-row">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="catalogSearchInput" placeholder="Search by name, scientific name, or tag..." oninput="handleSearchInput(this.value)">
        </div>

        <div class="filter-controls">
          <select id="sortSelect" class="custom-select" onchange="applyFilters()">
            <option value="featured">Sort: Featured Picks</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating_desc">Highest Rated</option>
            <option value="reviews_desc">Most Reviewed</option>
          </select>

          <select id="lightSelect" class="custom-select" onchange="applyFilters()">
            <option value="all">All Sunlight Needs</option>
            <option value="Full Sun">Full Sun (6+ hrs)</option>
            <option value="Partial">Partial Sun / Shade</option>
            <option value="Indirect">Bright Indirect Light</option>
          </select>

          <label class="checkbox-pill" id="petPill" onclick="togglePetSafe()">
            <input type="checkbox" id="petSafeOnly" style="display:none;">
            <span>🐾 Pet Safe Only</span>
          </label>
        </div>
      </div>

      <!-- Category Filter Tabs -->
      <div class="category-tabs" id="categoryTabs">
        <button class="cat-tab-btn active" data-cat="all" onclick="selectCategory('all', this)">All Cultivars</button>
        <button class="cat-tab-btn" data-cat="Flower Seeds" onclick="selectCategory('Flower Seeds', this)">Flower Seeds</button>
        <button class="cat-tab-btn" data-cat="Vegetable Seeds" onclick="selectCategory('Vegetable Seeds', this)">Vegetable Seeds</button>
        <button class="cat-tab-btn" data-cat="Live Plants" onclick="selectCategory('Live Plants', this)">Live Plants</button>
        <button class="cat-tab-btn" data-cat="Fruit Plants" onclick="selectCategory('Fruit Plants', this)">Fruit Plants</button>
        <button class="cat-tab-btn" data-cat="Planters & Pots" onclick="selectCategory('Planters & Pots', this)">Planters & Pots</button>
        <button class="cat-tab-btn" data-cat="Plant Stands" onclick="selectCategory('Plant Stands', this)">Plant Stands</button>
        <button class="cat-tab-btn" data-cat="Plant Care" onclick="selectCategory('Plant Care', this)">Organic Care & Feed</button>
      </div>
    </div>
  </div>

  <!-- Catalog Content Section -->
  <main class="catalog-main">
    <div class="results-bar">
      <div>Showing <strong id="itemCountDisplay">0</strong> botanical items</div>
      <div id="activeFilterBadge" style="color: var(--sage-500); font-weight: 600;"></div>
    </div>

    <div id="catalogGrid" class="product-grid">
      <!-- Injected dynamically -->
    </div>
  </main>

  <div id="global-footer"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script src="js/catalog.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>

  <script>
    let allProducts = [];
    let currentCategory = 'all';
    let petOnly = false;

    document.addEventListener('DOMContentLoaded', async () => {
      Store.renderHeader('products');
      Store.renderFooter();

      // Read URL Query params (e.g. ?category=Flower%20Seeds or ?search=rose)
      const params = new URLSearchParams(window.location.search);
      const urlCat = params.get('category');
      const urlSearch = params.get('search');

      if (urlCat) {
        currentCategory = urlCat;
        document.querySelectorAll('.cat-tab-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.cat.toLowerCase() === urlCat.toLowerCase());
        });
      }

      if (urlSearch) {
        document.getElementById('catalogSearchInput').value = urlSearch;
      }

      if (params.get('focus') === 'search') {
        document.getElementById('catalogSearchInput').focus();
      }

      // Live subscription to catalog
      ProductService.subscribeToProducts(products => {
        allProducts = products;
        applyFilters();
      });
    });

    function selectCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function togglePetSafe() {
      petOnly = !petOnly;
      const pill = document.getElementById('petPill');
      pill.classList.toggle('active', petOnly);
      applyFilters();
    }

    function handleSearchInput(val) {
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('catalogSearchInput').value.toLowerCase().trim();
      const sortVal = document.getElementById('sortSelect').value;
      const lightVal = document.getElementById('lightSelect').value;

      let filtered = [...allProducts];

      // Category filter
      if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category.toLowerCase() === currentCategory.toLowerCase());
      }

      // Search term
      if (searchTerm) {
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(searchTerm) ||
          (p.scientificName && p.scientificName.toLowerCase().includes(searchTerm)) ||
          p.category.toLowerCase().includes(searchTerm) ||
          (p.tags && p.tags.some(t => t.toLowerCase().includes(searchTerm)))
        );
      }

      // Pet safe filter
      if (petOnly) {
        filtered = filtered.filter(p => p.petSafe === true);
      }

      // Light filter
      if (lightVal !== 'all') {
        filtered = filtered.filter(p => p.sunlight && p.sunlight.toLowerCase().includes(lightVal.toLowerCase()));
      }

      // Sorting
      if (sortVal === 'price_asc') {
        filtered.sort((a,b) => (a.salePrice || a.price) - (b.salePrice || b.price));
      } else if (sortVal === 'price_desc') {
        filtered.sort((a,b) => (b.salePrice || b.price) - (a.salePrice || a.price));
      } else if (sortVal === 'rating_desc') {
        filtered.sort((a,b) => (b.rating || 0) - (a.rating || 0));
      } else if (sortVal === 'reviews_desc') {
        filtered.sort((a,b) => (b.reviews || 0) - (a.reviews || 0));
      }

      renderGrid(filtered);
    }

    function renderGrid(products) {
      const container = document.getElementById('catalogGrid');
      document.getElementById('itemCountDisplay').textContent = products.length;

      if (products.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 3.5rem; margin-bottom: 12px;">🪴</div>
            <h3 style="margin-bottom: 8px;">No matching botanical items found</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Try adjusting your search keywords, light requirements, or category filters.</p>
            <button class="btn-botanical btn-botanical-primary" onclick="resetAllFilters()">Reset All Filters</button>
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(p => {
        const isWish = Store.isInWishlist(p.id);
        const stockStatus = p.stock > 0 
          ? (p.stock < 15 ? `<span style="color:#d97706; font-size:0.75rem; font-weight:700;"><i class="fas fa-clock"></i> Only ${p.stock} left</span>` : `<span style="color:#10b981; font-size:0.75rem; font-weight:700;"><i class="fas fa-check"></i> In Stock (${p.stock})</span>`)
          : `<span style="color:#ef4444; font-size:0.75rem; font-weight:700;"><i class="fas fa-times"></i> Out of Stock</span>`;

        return `
          <div class="botanical-card" onclick="window.location.href='productdetails.html?id=${p.id}'" style="cursor: pointer;">
            <div class="card-img-wrap">
              <img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='garden.jpg'">
              <span class="card-badge"><i class="fas fa-leaf" style="color: var(--sage-500);"></i> ${p.category}</span>
              <button class="card-wish-btn ${isWish ? 'active' : ''}" onclick="event.stopPropagation(); const added = Store.toggleWishlist(INITIAL_CATALOG.find(x => x.id === ${p.id}) || { id: ${p.id}, name: '${p.name.replace(/'/g, "\\'")}', price: ${p.price}, image: '${p.image}' }); this.classList.toggle('active', added);">
                <i class="${isWish ? 'fas' : 'far'} fa-heart"></i>
              </button>
            </div>
            <div class="card-body">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <span class="card-category">${p.category}</span>
                <div>${stockStatus}</div>
              </div>
              <h3 class="card-title">${p.name}</h3>
              <div class="card-botanical-name">${p.scientificName || 'Botanical specimen'}</div>
              
              <div class="card-attributes">
                <span class="attr-tag"><i class="fas fa-sun" style="color: #f5a623;"></i> ${p.sunlight || 'Sunlight'}</span>
                <span class="attr-tag"><i class="fas fa-tint" style="color: #4a90e2;"></i> ${p.watering || 'Water'}</span>
                ${p.petSafe ? '<span class="attr-tag" style="color: #2e7d32;"><i class="fas fa-paw"></i> Pet Safe</span>' : ''}
              </div>

              <div style="display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: #f5a623; margin-bottom: 12px;">
                <i class="fas fa-star"></i>
                <strong style="color: var(--forest-900);">${p.rating || 4.5}</strong>
                <span style="color: var(--text-muted);">(${p.reviews || 50} reviews)</span>
              </div>

              <div class="card-footer">
                <div class="card-pricing">
                  <span class="price-current">₹${p.salePrice || p.price}</span>
                  ${p.salePrice ? `<span class="price-original">₹${p.price}</span>` : ''}
                </div>
                <button class="btn-card-add" title="Add to Cart" onclick="event.stopPropagation(); Store.addToCart(INITIAL_CATALOG.find(x => x.id === ${p.id}) || { id: ${p.id}, name: '${p.name.replace(/'/g, "\\'")}', price: ${p.salePrice || p.price}, image: '${p.image}' });">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function resetAllFilters() {
      document.getElementById('catalogSearchInput').value = '';
      document.getElementById('sortSelect').value = 'featured';
      document.getElementById('lightSelect').value = 'all';
      petOnly = false;
      document.getElementById('petPill').classList.remove('active');
      currentCategory = 'all';
      document.querySelectorAll('.cat-tab-btn').forEach((b, idx) => b.classList.toggle('active', idx === 0));
      applyFilters();
    }
  </script>
</body>
</html>
