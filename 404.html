<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Not Found (404) | Green Garden</title>
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/botanical-theme.css">
  <style>
    .not-found-wrap {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
    }
    .not-found-box {
      max-width: 540px;
      background: #fff;
      padding: 48px 36px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>
  <div id="global-header"></div>

  <div class="not-found-wrap">
    <div class="not-found-box">
      <div style="font-size: 4.5rem; margin-bottom: 12px;">🪴</div>
      <div style="font-family: var(--font-display); font-size: 1.1rem; color: var(--sage-500); font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">Error 404</div>
      <h1 style="font-size: 2.2rem; margin: 8px 0 16px;">This Specimen Has Been Repotted</h1>
      <p style="color: var(--text-secondary); margin-bottom: 30px; line-height: 1.6;">
        The page or botanical variety you are seeking has grown in another direction or doesn't exist in our current conservatory catalog.
      </p>
      <div style="display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;">
        <a href="index.html" class="btn-botanical btn-botanical-primary">
          <i class="fas fa-home"></i> Back to Haven
        </a>
        <a href="products.html" class="btn-botanical btn-botanical-secondary">
          <i class="fas fa-seedling"></i> Browse Catalog
        </a>
      </div>
    </div>
  </div>

  <div id="global-footer"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script src="js/catalog.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Store.renderHeader();
      Store.renderFooter();
    });
  </script>
</body>
</html>
