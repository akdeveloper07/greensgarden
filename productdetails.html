<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botanical Product Details | Green Garden</title>
  <link rel="icon" type="image/png" href="icon-512.png">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/botanical-theme.css">

  <style>
    .details-page-wrap {
      max-width: 1360px;
      margin: 0 auto;
      padding: 30px 24px 80px;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .breadcrumbs a:hover {
      color: var(--forest-700);
    }

    .product-details-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 56px;
      align-items: start;
    }

    /* Gallery */
    .gallery-container {
      position: sticky;
      top: 100px;
    }

    .main-image-frame {
      width: 100%;
      height: 480px;
      background: var(--ivory-100);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .main-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .main-image-frame:hover img {
      transform: scale(1.05);
    }

    .thumb-strip {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .thumb-btn {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: #fff;
    }

    .thumb-btn.active {
      border-color: var(--forest-700);
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Info Column */
    .product-info-col {
      display: flex;
      flex-direction: column;
    }

    .badge-category {
      display: inline-block;
      align-self: flex-start;
      background: var(--sage-100);
      color: var(--forest-800);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
    }

    .prod-main-title {
      font-size: 2.6rem;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .prod-scientific-name {
      font-style: italic;
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .stars-wrap {
      color: #f5a623;
      font-size: 1rem;
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 24px;
    }

    .price-tag-large {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--forest-900);
    }

    .price-strike-large {
      font-size: 1.3rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .savings-badge {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
    }

    /* Variant Selector */
    .variant-group {
      margin-bottom: 24px;
    }

    .variant-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .var-pill {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .var-pill.active {
      background: var(--forest-800);
      color: #fff;
      border-color: var(--forest-800);
    }

    /* Quantity and Action Buttons */
    .action-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .qty-stepper {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      background: #fff;
      padding: 4px;
    }

    .qty-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--ivory-50);
      color: var(--forest-900);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-btn:hover {
      background: var(--sage-200);
    }

    .qty-display {
      width: 44px;
      text-align: center;
      font-weight: 700;
      font-size: 1rem;
    }

    /* Delivery Pincode Checker */
    .pincode-card {
      background: var(--ivory-100);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 30px;
      border: 1px solid var(--border-subtle);
    }

    .pincode-form {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .pincode-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-subtle);
      background: #fff;
      outline: none;
    }

    /* Care Specifications Table */
    .care-specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }

    .care-card {
      background: #fff;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .care-card i {
      font-size: 1.3rem;
      margin-top: 2px;
    }

    .care-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .care-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--forest-900);
    }

    @media (max-width: 900px) {
      .product-details-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
      .gallery-container {
        position: static;
      }
    }
  </style>
</head>
<body>

  <div id="global-header"></div>

  <main class="details-page-wrap">
    <!-- Breadcrumb trail -->
    <div class="breadcrumbs">
      <a href="index.html">Home</a>
      <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
      <a href="products.html">Catalog</a>
      <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
      <span id="bcCategory">Category</span>
      <i class="fas fa-chevron-right" style="font-size: 0.7rem;"></i>
      <span id="bcName" style="color: var(--forest-900); font-weight: 600;">Product</span>
    </div>

    <!-- Product Details Two-Column Grid -->
    <div class="product-details-grid" id="productGridContainer">
      <!-- Injected by script -->
      <div style="grid-column: 1 / -1; text-align: center; padding: 100px;">
        <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--sage-500);"></i>
      </div>
    </div>

    <!-- Related Botanical Specimens Section -->
    <section style="margin-top: 80px;">
      <div class="section-header">
        <div>
          <h2 style="font-size: 2rem;">Cultivars You May Also Love</h2>
          <p class="section-desc">Hand-picked companion plants and seeds with matching soil and sunlight profiles.</p>
        </div>
      </div>
      <div id="relatedGrid" class="product-grid"></div>
    </section>
  </main>

  <div id="global-footer"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script src="js/catalog.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/store.js"></script>

  <script>
    let activeProduct = null;
    let selectedQuantity = 1;
    let selectedVariant = null;

    document.addEventListener('DOMContentLoaded', async () => {
      Store.renderHeader('products');
      Store.renderFooter();

      const params = new URLSearchParams(window.location.search);
      const prodId = parseInt(params.get('id')) || 1;

      // Load products from ProductService (which merges catalog + Firestore)
      const products = await ProductService.getAll();
      activeProduct = products.find(p => p.id === prodId) || products[0];

      if (activeProduct) {
        selectedVariant = activeProduct.variants ? activeProduct.variants[0] : null;
        renderProductDetails(activeProduct);
        renderRelatedProducts(activeProduct, products);
      }
    });

    function renderProductDetails(p) {
      document.title = `${p.name} | Green Garden Botanical Haven`;
      document.getElementById('bcCategory').textContent = p.category;
      document.getElementById('bcName').textContent = p.name;

      const isWish = Store.isInWishlist(p.id);
      const discountPercent = p.salePrice ? Math.round(((p.price - p.salePrice) / p.price) * 100) : 0;

      const container = document.getElementById('productGridContainer');
      container.innerHTML = `
        <!-- Gallery Column -->
        <div class="gallery-container">
          <div class="main-image-frame">
            <img id="mainGalleryImg" src="${p.image}" alt="${p.name}" onerror="this.src='garden.jpg'">
          </div>
          <div class="thumb-strip">
            <div class="thumb-btn active" onclick="switchImage('${p.image}', this)">
              <img src="${p.image}" onerror="this.src='garden.jpg'">
            </div>
            <div class="thumb-btn" onclick="switchImage('garden.jpg', this)">
              <img src="garden.jpg">
            </div>
            <div class="thumb-btn" onclick="switchImage('Ak.jpg', this)">
              <img src="Ak.jpg">
            </div>
          </div>
        </div>

        <!-- Info Column -->
        <div class="product-info-col">
          <span class="badge-category">${p.category}</span>
          <h1 class="prod-main-title">${p.name}</h1>
          <div class="prod-scientific-name">${p.scientificName || 'Botanical specimen'}</div>

          <div class="rating-row">
            <div class="stars-wrap">
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star"></i>
              <i class="fas fa-star-half-alt"></i>
            </div>
            <strong style="color: var(--forest-900); font-size: 1rem;">${p.rating || 4.8}</strong>
            <span style="color: var(--text-muted); font-size: 0.9rem;">• ${p.reviews || 120} verified gardener reviews</span>
            <span style="color: var(--sage-500); font-weight: 700; margin-left: auto;">
              <i class="fas fa-check-circle"></i> Nursery Verified
            </span>
          </div>

          <div class="price-box">
            <span class="price-tag-large">₹${p.salePrice || p.price}</span>
            ${p.salePrice ? `<span class="price-strike-large">₹${p.price}</span>` : ''}
            ${discountPercent ? `<span class="savings-badge">Save ${discountPercent}%</span>` : ''}
            <span style="color: var(--text-muted); font-size: 0.85rem;">(Inclusive of all taxes & botanical warranty)</span>
          </div>

          <p style="color: var(--text-secondary); font-size: 1rem; line-height: 1.7; margin-bottom: 24px;">
            ${p.description || 'Specially selected and tested for peak vitality and high germination.'}
          </p>

          <!-- Variant Selector -->
          ${p.variants && p.variants.length > 0 ? `
            <div class="variant-group">
              <label style="font-weight: 700; font-size: 0.88rem; color: var(--forest-900);">Select Specification / Size:</label>
              <div class="variant-pills">
                ${p.variants.map((v, i) => `
                  <button type="button" class="var-pill ${i === 0 ? 'active' : ''}" onclick="selectVariant('${v}', this)">
                    ${v}
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Quantity & Purchase Action Row -->
          <div class="action-row">
            <div class="qty-stepper">
              <button class="qty-btn" onclick="updateQty(-1)"><i class="fas fa-minus"></i></button>
              <span class="qty-display" id="qtyDisplay">1</span>
              <button class="qty-btn" onclick="updateQty(1)"><i class="fas fa-plus"></i></button>
            </div>

            <button class="btn-botanical btn-botanical-primary" style="flex: 1;" onclick="handleAddToCart()">
              <i class="fas fa-shopping-bag"></i> Add to Cart
            </button>

            <button class="btn-botanical btn-botanical-accent" style="flex: 1;" onclick="handleBuyNow()">
              <i class="fas fa-bolt"></i> Buy Now
            </button>

            <button class="card-wish-btn ${isWish ? 'active' : ''}" style="position: static; width: 48px; height: 48px;" onclick="const added = Store.toggleWishlist(activeProduct); this.classList.toggle('active', added);">
              <i class="${isWish ? 'fas' : 'far'} fa-heart"></i>
            </button>
          </div>

          <!-- Pincode Serviceability & Delivery Checker -->
          <div class="pincode-card">
            <div style="font-weight: 700; font-size: 0.9rem; color: var(--forest-900); display: flex; align-items: center; gap: 8px;">
              <i class="fas fa-shipping-fast" style="color: var(--sage-500);"></i> Check Delivery Pincode:
            </div>
            <div class="pincode-form">
              <input type="text" id="pincodeInput" class="pincode-input" placeholder="Enter 6-digit PIN code (e.g. 560001)" maxlength="6">
              <button class="btn-botanical btn-botanical-secondary" style="padding: 8px 18px;" onclick="checkPincode()">Check</button>
            </div>
            <div id="pincodeResult" style="font-size: 0.82rem; margin-top: 8px; color: var(--text-secondary);">
              Standard botanical delivery: 3-5 business days with live hydration pack.
            </div>
          </div>

          <!-- Horticultural Care Guide Matrix -->
          <div style="font-family: var(--font-serif); font-size: 1.3rem; margin-bottom: 14px;">Botanical Care & Growing Matrix</div>
          <div class="care-specs-grid">
            <div class="care-card">
              <i class="fas fa-sun" style="color: #f5a623;"></i>
              <div>
                <div class="care-title">Sunlight</div>
                <div class="care-val">${p.sunlight || 'Full Sunlight'}</div>
              </div>
            </div>

            <div class="care-card">
              <i class="fas fa-tint" style="color: #4a90e2;"></i>
              <div>
                <div class="care-title">Watering</div>
                <div class="care-val">${p.watering || 'Moderate'}</div>
              </div>
            </div>

            <div class="care-card">
              <i class="fas fa-paw" style="color: ${p.petSafe ? '#2e7d32' : '#e63946'};"></i>
              <div>
                <div class="care-title">Pet Safety</div>
                <div class="care-val">${p.petSafe ? 'Safe for Pets' : 'Keep Away From Pets'}</div>
              </div>
            </div>

            <div class="care-card">
              <i class="fas fa-seedling" style="color: var(--forest-700);"></i>
              <div>
                <div class="care-title">Care Level</div>
                <div class="care-val">${p.difficulty || 'Easy Care'}</div>
              </div>
            </div>
          </div>

          <!-- Smart Plant Passport Quick Action -->
          <div style="background: #ffffff; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 16px; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-weight: 700; font-size: 0.95rem; color: var(--forest-900);">Digital Plant Passport Ready</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">Track watering schedules and growth milestones for this plant.</div>
            </div>
            <a href="plant-care.html" class="btn-botanical btn-botanical-secondary" style="font-size: 0.82rem; padding: 6px 14px;">
              <i class="fas fa-calendar-plus"></i> Set Reminders
            </a>
          </div>
        </div>
      `;
    }

    function switchImage(src, btn) {
      document.getElementById('mainGalleryImg').src = src;
      document.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function selectVariant(varName, btn) {
      selectedVariant = varName;
      document.querySelectorAll('.var-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function updateQty(delta) {
      selectedQuantity = Math.max(1, selectedQuantity + delta);
      document.getElementById('qtyDisplay').textContent = selectedQuantity;
    }

    function handleAddToCart() {
      if (!activeProduct) return;
      Store.addToCart(activeProduct, selectedQuantity, selectedVariant);
    }

    function handleBuyNow() {
      if (!activeProduct) return;
      Store.addToCart(activeProduct, selectedQuantity, selectedVariant);
      window.location.href = 'buy.html';
    }

    function checkPincode() {
      const pin = document.getElementById('pincodeInput').value.trim();
      const res = document.getElementById('pincodeResult');
      if (pin.length !== 6 || isNaN(pin)) {
        res.innerHTML = '<span style="color: #e63946;"><i class="fas fa-times-circle"></i> Please enter a valid 6-digit Indian PIN code</span>';
        return;
      }
      res.innerHTML = `<span style="color: #2e7d32;"><i class="fas fa-check-circle"></i> Serviceable! Estimated climate-safe express delivery by <strong>${new Date(Date.now() + 3*24*60*60*1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric'})}</strong></span>`;
    }

    function renderRelatedProducts(curr, all) {
      const related = all.filter(p => p.id !== curr.id && p.category === curr.category).slice(0, 4);
      const container = document.getElementById('relatedGrid');
      
      container.innerHTML = related.map(p => `
        <div class="botanical-card" onclick="window.location.href='productdetails.html?id=${p.id}'" style="cursor: pointer;">
          <div class="card-img-wrap">
            <img src="${p.image}" alt="${p.name}" onerror="this.src='garden.jpg'">
            <span class="card-badge">${p.category}</span>
          </div>
          <div class="card-body">
            <h3 class="card-title">${p.name}</h3>
            <div class="card-botanical-name">${p.scientificName || ''}</div>
            <div class="card-footer">
              <div class="card-pricing">
                <span class="price-current">₹${p.salePrice || p.price}</span>
              </div>
              <button class="btn-card-add" onclick="event.stopPropagation(); Store.addToCart(INITIAL_CATALOG.find(x => x.id === ${p.id}) || { id: ${p.id}, name: '${p.name.replace(/'/g, "\\'")}', price: ${p.salePrice || p.price}, image: '${p.image}' });">
                <i class="fas fa-plus"></i>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
